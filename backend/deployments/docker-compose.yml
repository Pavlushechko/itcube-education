services:
  db:
    image: postgres:16
    container_name: education-db
    environment:
      POSTGRES_DB: education
      POSTGRES_USER: education
      POSTGRES_PASSWORD: education
    ports:
      - "55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education -d education"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: education-migrate
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../internal/migrations:/migrations:ro
    command:
      [
        "-path", "/migrations",
        "-database", "postgresql://education:education@db:5432/education?sslmode=disable",
        "up"
      ]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: education-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      disable: true

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: education-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio12345; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb -p local/education || true;
      mc anonymous set download local/education || true;
      exit 0;
      "
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: education-backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_PORT: "8080"
      DATABASE_URL: "postgresql://education:education@db:5432/education?sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"   # <-- без http://
      MINIO_ACCESS_KEY: "minio"
      MINIO_SECRET_KEY: "minio12345"
      MINIO_BUCKET: "education"
      MINIO_USE_SSL: "false"
    ports:
      - "8080:8080"

volumes:
  db_data:
  minio_data: